<style>

:root {
    --bg-gradient: linear-gradient(135deg, #ff9233 0%, #ea580c 100%);

    --card-bg: #ffffff;
    --card-text: #1e293b;
    --sub-text: #64748b;

    --btn-bg: rgba(255,255,255,.25);
    --btn-text: #ffffff;
    --btn-active-bg: #ffffff;
    --btn-active-text: #ea580c;

    --c300: #06b6d4;
    --c500: #22c55e;
    --c800: #eab308;
    --c1000: #3b82f6;
    --c2000: #10b981;
    --c3000: #f59e0b;
    --c5000: #ec4899;
    --c10000: #8b5cf6;
}

* {
    box-sizing: border-box;
}

body {
    font-family:
        'Plus Jakarta Sans',
        'Noto Sans JP',
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    background: var(--bg-gradient);
    background-attachment: fixed;

    color: #ffffff;

    margin: 0;
    padding: 16px;

    min-height: 100vh;

    -webkit-tap-highlight-color: transparent;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
}

h1 {
    text-align: center;

    font-size: 1.7rem;
    font-weight: 800;

    letter-spacing: .05em;

    margin: 8px 0 6px;

    color: #ffffff;

    text-shadow:
        0 2px 4px rgba(0,0,0,.15);
}

.subtitle {
    text-align: center;

    font-size: .85rem;
    font-weight: 600;

    opacity: .85;

    margin-bottom: 20px;
}


/* ===============================
   FILTER
================================ */

.filter-container {
    display: flex;
    flex-wrap: wrap;

    justify-content: center;

    gap: 8px;

    margin-bottom: 20px;
}

.filter-btn {
    background: var(--btn-bg);
    color: var(--btn-text);

    border:
        1px solid rgba(255,255,255,.4);

    padding: 9px 13px;

    border-radius: 999px;

    font-size: .82rem;
    font-weight: 700;

    cursor: pointer;

    transition:
        transform .18s ease,
        background .18s ease,
        color .18s ease,
        box-shadow .18s ease;

    backdrop-filter: blur(4px);
}

.filter-btn:hover {
    background: rgba(255,255,255,.35);
}

.filter-btn:active {
    transform: scale(.92);
}

.filter-btn.active {
    background: var(--btn-active-bg);
    color: var(--btn-active-text);

    border-color: #ffffff;

    box-shadow:
        0 3px 10px rgba(0,0,0,.15);
}


/* ===============================
   GRID
================================ */

.grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(280px,1fr));

    gap: 14px;
}


/* ===============================
   CARD
================================ */

.card {
    background: var(--card-bg);
    color: var(--card-text);

    border-radius: 14px;

    padding: 12px;

    border-left: 6px solid #ccc;

    box-shadow:
        0 6px 16px rgba(0,0,0,.12);

    display: flex;

    gap: 12px;

    align-items: center;

    transition:
        transform .18s ease,
        box-shadow .18s ease;

    animation:
        cardIn .45s cubic-bezier(.22, 1, .36, 1) both;

    will-change:
        transform,
        opacity;
}


/* ===============================
   CARD ENTER ANIMATION
================================ */

@keyframes cardIn {

    0% {
        opacity: 0;
        transform:
            translateY(24px)
            scale(.96);
    }

    60% {
        opacity: 1;
        transform:
            translateY(-3px)
            scale(1.01);
    }

    100% {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }

}


@media (hover:hover) {

    .card:not(.disabled):hover {

        transform:
            translateY(-4px)
            scale(1.01);

        box-shadow:
            0 12px 26px rgba(0,0,0,.18);
    }

}


/* ===============================
   COIN COLOR
================================ */

.card[data-coin="300"] {
    border-color: var(--c300);
}

.card[data-coin="500"] {
    border-color: var(--c500);
}

.card[data-coin="800"] {
    border-color: var(--c800);
}

.card[data-coin="1000"] {
    border-color: var(--c1000);
}

.card[data-coin="2000"] {
    border-color: var(--c2000);
}

.card[data-coin="3000"] {
    border-color: var(--c3000);
}

.card[data-coin="5000"] {
    border-color: var(--c5000);
}

.card[data-coin="10000"] {
    border-color: var(--c10000);
}


/* ===============================
   IMAGE
================================ */

.gift-img {
    width: 68px;
    height: 68px;

    border-radius: 11px;

    object-fit: cover;

    background: #f1f5f9;

    flex-shrink: 0;

    box-shadow:
        inset 0 2px 4px rgba(0,0,0,.05);

    transition:
        filter .2s ease,
        opacity .2s ease;
}

.no-img {
    width: 68px;
    height: 68px;

    border-radius: 11px;

    background: #f1f5f9;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #94a3b8;

    font-size: .68rem;
    font-weight: 700;

    text-align: center;
}


/* ===============================
   TEXT
================================ */

.card-body {
    flex-grow: 1;
    min-width: 0;
}

.card-header {
    display: flex;

    justify-content: space-between;
    align-items: flex-start;

    gap: 8px;

    margin-bottom: 7px;
}

.gift-name {
    font-size: 1rem;
    font-weight: 800;

    color: #0f172a;

    line-height: 1.3;
}

.coin-badge {
    flex-shrink: 0;

    font-size: .73rem;
    font-weight: 800;

    padding: 3px 8px;

    border-radius: 12px;

    background: #fff7ed;
    color: #ea580c;

    border:
        1px solid #ffedd5;
}

.desc {
    color: var(--sub-text);

    font-size: .87rem;
    font-weight: 500;

    line-height: 1.45;
}


/* ===============================
   未搭載バッジ
================================ */

.not-installed {
    display: inline-block;

    color: #6b7280;
    background: #d1d5db;

    border:
        1px solid #cbd5e1;

    padding: 3px 9px;

    border-radius: 999px;

    font-size: .75rem;
    font-weight: 700;

    letter-spacing: .04em;
}


/* ===============================
   未搭載カード
================================ */

.card.disabled {
    background: #e5e7eb;

    border-left-color: #9ca3af !important;

    box-shadow:
        0 4px 10px rgba(0,0,0,.08);

    opacity: .72;
}

.card.disabled .gift-img {
    filter: grayscale(100%);
    opacity: .65;
}

.card.disabled .no-img {
    background: #d1d5db;
    color: #9ca3af;
}

.card.disabled .gift-name {
    color: #6b7280;
}

.card.disabled .coin-badge {
    background: #d1d5db;
    color: #6b7280;

    border-color: #cbd5e1;
}

.card.disabled:hover {
    transform: none;

    box-shadow:
        0 4px 10px rgba(0,0,0,.08);
}


/* ===============================
   MOBILE
================================ */

@media (max-width:480px) {

    body {
        padding: 12px;
    }

    h1 {
        font-size: 1.5rem;
    }

    .grid {
        grid-template-columns: 1fr;
        gap: 11px;
    }

    .filter-container {
        gap: 6px;
    }

    .filter-btn {

        font-size: .78rem;
    }

        height: 62px;
    }

    .gift-name {
        font-size: .95rem;
    }

    .desc {
        font-size: .82rem;
    }

}

</style>
</head>

/* =====================================================

function render() {

    grid.innerHTML = "";


    const filtered =
        giftData.filter(gift => {

            if (currentFilter === "all") {
                return true;
            }

            return gift.coin.toString() === currentFilter;

        });


    filtered.forEach((gift, index) => {

        const card =
            document.createElement("div");

        card.className = "card";


        /* =========================
           登場タイミング
        ========================= */

        card.style.animationDelay =
            `${index * 55}ms`;


        /* =========================
           未搭載判定
        ========================= */

        if (gift.desc === "未搭載") {

            card.classList.add("disabled");

        }


        card.setAttribute(
            "data-coin",
            gift.coin
        );


        /* =========================
           IMAGE
        ========================= */

        let imgHTML;

        if (gift.img) {

            imgHTML = `

                <img
                    src="${gift.img}"
                    alt="${gift.name}"
                    class="gift-img"

                    onerror="
                        this.outerHTML =
                        '<div class=\\'no-img\\'>No Img</div>'
                    "
                >

            `;

        } else {

            imgHTML = `

                <div class="no-img">
                    No Img
                </div>

            `;

        }


        /* =========================
           DESCRIPTION
        ========================= */

        let descHTML;

        if (gift.desc === "未搭載") {

            descHTML = `

                <span class="not-installed">
                    未搭載
                </span>

            `;

        } else {

            descHTML = `

                <div class="desc">
                    ${gift.desc}
                </div>

            `;

        }


        /* =========================
           CARD
        ========================= */

        card.innerHTML = `

            ${imgHTML}

            <div class="card-body">

                <div class="card-header">

                    <span class="gift-name">
                        ${gift.name}
                    </span>

                    <span class="coin-badge">
                        ${gift.coin.toLocaleString()}c
                    </span>

                </div>

                ${descHTML}

            </div>

        `;


        grid.appendChild(card);

    });

}


/* =====================================================
   FILTER
===================================================== */

function filterGifts(coin, button) {

    currentFilter = coin;


    document
        .querySelectorAll(".filter-btn")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");


    render();

}


/* =====================================================
   START
===================================================== */

render();
